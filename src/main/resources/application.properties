# MySQL Driver & URL for Aiven Cloud
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate Dialect (optional in Spring Boot 3+ / Hibernate 6+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Validation mode
spring.jpa.properties.jakarta.persistence.validation.mode=none

app.cors.allowed-origins=http://localhost:5173,https://your-frontend-domain.com