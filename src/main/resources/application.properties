# MySQL Driver & URL (ensure you replace 'your_db_name' with your actual database name)
# Replace 'hrms_db' with your actual database/schema name
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=92407
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate Dialect (optional in Spring Boot 3+ / Hibernate 6+, as it is auto-detected)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Validation mode
spring.jpa.properties.jakarta.persistence.validation.mode=none

app.cors.allowed-origins=http://localhost:5173,https://your-frontend-domain.com